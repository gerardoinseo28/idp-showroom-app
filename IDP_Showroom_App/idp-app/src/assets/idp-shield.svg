  <path d="M100 20 L173 48 L173 118 Q173 183 100 216 Q27 183 27 118 L27 48 Z"
        fill="none" stroke="url(#metal)" stroke-width="2" opacity="0.7"/>
  <!-- estrella 4 puntas -->
  <path d="M100 38 L108 74 L126 82 L108 90 L100 126 L92 90 L74 82 L92 74 Z"
        fill="url(#metal)" filter="url(#glow)"/>
  <!-- IDP -->
  <text x="100" y="170" font-family="Arial Black, Arial, sans-serif" font-weight="900"
        font-size="58" fill="url(#metal)" text-anchor="middle" letter-spacing="2">IDP</text>
  <text x="155" y="140" font-family="Arial" font-size="13" fill="url(#metal)" text-anchor="middle">TM</text>
  <!-- subtítulo -->
  <text x="100" y="190" font-family="Arial" font-weight="600" font-size="13" fill="url(#metal)" text-anchor="middle" letter-spacing="0.5">VEHICLE</text>
  <text x="100" y="204" font-family="Arial" font-weight="600" font-size="13" fill="url(#metal)" text-anchor="middle" letter-spacing="0.5">INTEGRITY</text>
  <text x="100" y="218" font-family="Arial" font-weight="600" font-size="13" fill="url(#metal)" text-anchor="middle" letter-spacing="0.5">STANDARD</text>
</svg>
