<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe6b0"/>
      <stop offset="0.45" stop-color="#ffb24a"/>
      <stop offset="0.55" stop-color="#e8902a"/>
      <stop offset="1" stop-color="#ffd28a"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- contorno escudo -->
  <path d="M100 8 L185 40 L185 120 Q185 195 100 232 Q15 195 15 120 L15 40 Z"
